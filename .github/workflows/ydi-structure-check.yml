name: YDI構造チェック

on:
  workflow_call:
    inputs:
      kind:
        description: リポジトリ種別
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kind:
        description: リポジトリ種別
        required: false
        default: root
        type: choice
        options:
          - root
          - unit
          - service

permissions:
  contents: read
  issues: read

jobs:
  check:
    name: 構造ずれを検査
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: リポジトリ種別を決定
        id: repo
        env:
          CALLED_KIND: ${{ inputs.kind }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_call" ]; then
            kind="$CALLED_KIND"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$CALLED_KIND" ]; then
            kind="$CALLED_KIND"
          else
            kind="root"
          fi

          case "$kind" in
            root|unit|service) ;;
            *)
              echo "不明なリポジトリ種別: $kind"
              exit 1
              ;;
          esac

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "リポジトリ種別: $kind"

      - name: 未完了のGitHub Issueがないことを確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          count="$(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq '[.[] | select(has("pull_request") | not)] | length' \
              | awk '{ total += $1 } END { print total + 0 }'
          )"

          if [ "$count" -ne 0 ]; then
            echo "未完了のGitHub Issueが $count 件あります。"
            exit 1
          fi

          echo "未完了のGitHub Issue: 0"

      - name: 廃止済み表現を確認
        run: |
          set -eu

          failed=0

          for term in "正本" "YDI-Holdings" "類 Merge"; do
            if git grep -nF "$term" -- '*.md' ':!Log/**' ':!Playground/**' ':!Issues/**'; then
              echo "廃止済み表現を検出: $term"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "廃止済み表現: 0"

      - name: ユニットのエスカレを確認
        if: steps.repo.outputs.kind == 'unit'
        run: |
          set -eu

          test -f Issues.md

          first_line="$(head -n 1 Issues.md)"
          if [ "$first_line" != "# エスカレ" ]; then
            echo "Issues.md がエスカレ用途になっていません。"
            exit 1
          fi

          echo "エスカレ用 Issues.md: OK"

      - name: サービス側に Issues.md がないことを確認
        if: steps.repo.outputs.kind == 'service'
        run: |
          set -eu

          if [ -e Issues.md ]; then
            echo "サービスリポジトリに Issues.md が存在します。"
            exit 1
          fi

          echo "サービス側 Issues.md: なし"
